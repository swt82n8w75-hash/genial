name: Geniality iOS build and upload
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Put the Geniality build in place
        run: |
          mkdir -p www
          cp -R geniality/. www/
          rm -f www/capacitor.config.json
          cp geniality/capacitor.config.json capacitor.config.json
          ls -la www | head -12
      - name: Install dependencies
        run: npm install
      - name: Add iOS platform if missing
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
      - name: Sync web assets
        run: npx cap sync ios
      - name: Write App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
      - name: Make the App Store provisioning profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: |
          python3 -c "import cryptography" 2>/dev/null || python3 -m pip install --quiet --break-system-packages --user cryptography
          python3 tools/asc_profile.py
      - name: Install the signing identity
        env:
          P12: ${{ secrets.ASC_P12_BASE64 }}
          P12PASS: ${{ secrets.ASC_P12_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          python3 -c "import base64,sys;open('/tmp/dist.p12','wb').write(base64.b64decode(sys.argv[1]))" "$P12"
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN" > /dev/null
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM=3GU37GL28P \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Package the IPA
        run: |
          cd ios/App
          APP=$(ls -d build/App.xcarchive/Products/Applications/*.app | head -1)
          echo "app: $APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -6
          rm -rf build/export && mkdir -p build/export/Payload
          cp -R "$APP" build/export/Payload/
          cd build/export && zip -qry App.ipa Payload
          unzip -l App.ipa | tail -3
      - uses: actions/upload-artifact@v4
        with:
          name: Geniality-ipa
          path: ios/App/build/export/*.ipa
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp ~/private_keys/AuthKey_$ASC_KEY_ID.p8 ~/.appstoreconnect/private_keys/
          cd ios/App/build/export
          xcrun altool --upload-app -f *.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
